defaults:
  - dataset: grab
  - model: indobert
  - tracker: wandb
  - _self_

project_name: "grab-voc-triage"
run_name: "indobert-base-run1"

# Hyperparameters
epochs: 5
batch_size: 16
eval_batch_size: 32
learning_rate: 2e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0
seed: 42

# Training setup
device: "cuda"  # "cuda" or "cpu"
num_workers: 2
pin_memory: true

# Checkpointing & Metric Tracking
primary_metric: "val_macro_f1_mean"
greater_is_better: true
checkpoint_dir: "checkpoints"
